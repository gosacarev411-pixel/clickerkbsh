<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путь от бомжа до миллионера</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Модальное окно регистрации -->
    <div id="registrationModal" class="modal">
        <div class="modal-content">
            <h2>Добро пожаловать в подворотню</h2>
            <p>Как тебя звать, новенький?</p>
            <input type="text" id="playerNameInput" placeholder="Например: Толян" maxlength="15">
            <button id="startBtn">Начать путь</button>
        </div>
    </div>

    <!-- Основной экран игры -->
    <div id="gameScreen">
        <div class="header">
            <h1 id="playerName">Бомж</h1>
            <div class="stats">
                <span>Уровень: <span id="level">1</span></span>
                <span>Деньги: $<span id="money">0</span></span>
                <span>Доход: $<span id="income">0</span>/сек</span>
            </div>
        </div>

        <div class="main-area">
            <div class="character" id="character">
                🧟‍♂️
            </div>
            <div class="tap-zone">
                <button id="tapBtn" class="tap-button">КЛИКНУТЬ</button>
                <p>чтобы заработать на банку тушенки</p>
            </div>
        </div>

        <div class="shop">
            <h3>Подворотные апгрейды</h3>
            <div id="upgradesContainer"></div>
        </div>
    </div>

    <script src="code.js"></script>
</body>
</html>
