<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путь от бомжа до миллионера</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Путь от бомжа до миллионера</h1>
        
        <div class="stats">
            <div>Деньги: <span id="money">10</span> $</div>
            <div>Энергия: <span id="energy">100</span> %</div>
            <div>Настроение: <span id="mood">100</span> %</div>
            <div>День: <span id="day">1</span></div>
        </div>

        <div id="story" class="story-box">
            Ты просыпаешься на скамейке в парке. В кармане 10 долларов. Пора что-то менять.
        </div>

        <div class="actions" id="actions">
            <button onclick="work('busker')">Играть на гитаре в метро (5$, -10 энергии)</button>
            <button onclick="work('bottle')">Сдавать бутылки (-20 энергии)</button>
        </div>

        <div class="actions" id="high-risk" style="display: none;">
            <button onclick="gamble('casino')">Сходить в подпольное казино (риск)</button>
            <button onclick="work('taxi')">«Побомбить» на старой машине (требует 50$ на бензин)</button>
    </div>

        <button onclick="nextDay()" id="sleep-btn" style="display: none;">Закончить день и поспать</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
