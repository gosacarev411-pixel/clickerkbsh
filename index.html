<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapMaster: Год в одной тапалке</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TapMaster</h1>
            <div class="user-stats">
                <span id="coins">Монеты: 0</span>
                <span id="energy">Энергия: 100/100</span>
                <span id="hunger">Сытость: 100/100</span>
            </div>
        </header>

        <main>
            <section class="tap-zone">
                <div class="tap-button" id="tapBtn">ТАП</div>
                <p id="tap-value">+1</p>
            </section>

            <section class="features">
                <div class="feature-card" onclick="openShop()">
                    <h3>Магазин</h3>
                    <p>Улучшения и еда</p>
                </div>
                <div class="feature-card" onclick="openCasino()">
                    <h3>Казино</h3>
                    <p>Рискни монетами</p>
                </div>
                <div class="feature-card" onclick="spinWheel()">
                    <h3>Колесо Фортуны</h3>
                    <p>Готово через: <span id="wheel-timer">24:00:00</span></p>
                </div>
            </section>
        </main>

        <div id="shopModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeShop()">&times;</span>
                <h2>Магазин</h2>
                <div id="shop-items"></div>
            </div>
        </div>
    </div>
    <script src="code.js"></script>
</body>
</html>
