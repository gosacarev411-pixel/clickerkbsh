<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TapMaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <h1 class="logo">🔹 TapMaster</h1>
        <div class="stats">
            <span><b>Монеты:</b> <span id="coins"></span></span>
            <span><b>Энергия:</b> <span id="energy"></span>/100</span>
            <span><b>Сытость:</b> <span id="hunger"></span>%</span>
        </div>
    </header>

    <!-- Основная зона тапа -->
    <main class="main">
        <button class="tap-btn" onclick="tap()">
            ТАП!
            <span class="tap-value">+1</span>
        </button>

        <!-- Карточки действий -->
        <section class="action-cards">
            <button class="card" onclick="openShop()">
                Магазин<br>Улучшения и еда
            </button>
            <button class="card" onclick="spinWheel()">
                Колесо Фортуны<br>Готово через:<br><span id="wheel-timer">24:00:00</span>
            </button>
            <button class="card" onclick="openCasino()">
                Казино<br>Рискни монетами
            </button>
        </section>
    </main>

    <!-- Модальное окно магазина -->
    <div id="modal-overlay" style="display:none;"></div>
    <div id="modal-window" style="display:none;">
        <h2>Магазин</h2>
        <div id="shop-items"></div>
        <button onclick="closeModal()">Закрыть</button>
    </div>

    <script src="code.js"></script>
</body>
</html>
