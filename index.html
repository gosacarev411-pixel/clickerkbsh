<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Bottle Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Игровой экран (Главная) -->
    <div id="game-screen" class="screen active">
        <div class="header">
            <div class="player-info">
                <span id="player-name">Игрок</span>
            </div>
            <div class="balance-container">
                <span id="score">0</span>
                <span class="coin-symbol">🪙</span>
            </div>
        </div>

        <div class="profit-info">
            <span>Доход в час: <strong id="profit-per-hour">+0</strong></span>
        </div>

        <!-- Центральная бутылка -->
        <div class="clicker-area">
            <div id="coin" class="bottle-container">
                <div class="glow"></div>
                <!-- Вместо хомяка — бутылка (эмодзи или картинка) -->
                <div id="coin-default-icon" class="bottle-icon">🍾</div>
            </div>
        </div>

        <!-- Шкала энергии -->
        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ <id id="energy-text">500 / 500</id></span>
            </div>
            <div class="energy-bar-bg">
                <div id="energy-progress" class="energy-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Меню навигации (как в Telegram Mini Apps) -->
    <div class="nav-bar">
        <button class="nav-btn active" data-target="game-screen">🏠 Главная</button>
        <button class="nav-btn" data-target="mine-screen">⛏️ Шахты</button>
        <button class="nav-btn" data-target="friends-screen">👥 Друзья</button>
    </div>

    <!-- Экран шахт (Прокачка пассивного дохода) -->
    <div id="mine-screen" class="screen">
        <h2>Улучшения шахт</h2>
        <p class="sub-title">Прокачивайте пассивный доход в час</p>
        <div class="upgrades-list">
            <div class="upgrade-item" id="buy-mining-upgrade">
                <div class="upgrade-icon">🚀</div>
                <div class="upgrade-details">
                    <h4>Космический бур</h4>
                    <p>Доход: +10 / час</p>
                    <span id="upgrade-mining-cost">Цена: 50 🪙</span>
                </div>
            </div>
            <div class="upgrade-item" id="buy-click-upgrade">
                <div class="upgrade-icon">⚡</div>
                <div class="upgrade-details">
                    <h4>Усиленный тап</h4>
                    <p>+1 к клику</p>
                    <span id="upgrade-click-cost">Цена: 100 🪙</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Экран друзей -->
    <div id="friends-screen" class="screen">
        <h2>Пригласите друзей!</h2>
        <p class="sub-title">Получайте бонусы за каждого друга</p>
        <div class="friend-card">
            <p>Пригласите друга и получите <strong>500 🪙</strong></p>
            <button class="invite-btn" onclick="alert('Ссылка скопирована в буфер обмена!')">Пригласить друга</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
