<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Богатей из бомжа</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .money-counter {
            font-size: 36px;
            font-weight: bold;
            color: #4cd137;
            margin-bottom: 5px;
        }
        .income-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #888);
        }
        .clicker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .coin-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f1c40f, #f39c12);
            border: none;
            box-shadow: 0 10px 25px rgba(241, 196, 15, 0.4);
            cursor: pointer;
            font-size: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
        }
        .upgrades-panel {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2c);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 45vh;
            overflow-y: auto;
        }
        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .upgrade-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        .upgrade-info p {
            margin: 0;
            font-size: 13px;
            color: #4cd137;
        }
        .buy-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .buy-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="money-counter" id="money">0 ₽</div>
        <div class="income-info" id="income">Доход в сек: 0 ₽</div>
    </div>

    <div class="clicker-container">
        <button class="coin-btn" id="clickBtn">💰</button>
    </div>

    <div class="upgrades-panel">
        <div class="upgrade-item">
            <div class="upgrade-info">
                <h4>Продажа газет</h4>
                <p id="u1-cost">Цена: 50 ₽ (+1/сек)</p>
            </div>


<button class="buy-btn" id="buy1" onclick="buyUpgrade(1)">Купить</button>
        </div>
        <div class="upgrade-item">
            <div class="upgrade-info">
                <h4>Мытье машин</h4>
                <p id="u2-cost">Цена: 300 ₽ (+5/сек)</p>
            </div>
            <button class="buy-btn" id="buy2" onclick="buyUpgrade(2)">Купить</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем на весь экран в Telegram

        // Данные игры
        let game = {
            money: 0,
            perClick: 1,
            perSecond: 0,
            upgrades: {
                1: { count: 0, cost: 50, cps: 1, costMult: 1.15 },
                2: { count: 0, cost: 300, cps: 5, costMult: 1.18 }
            }
        };

        // Загрузка данных из облака Telegram (или localStorage, если открыто в обычном браузере)
        function loadGame() {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem('save_data', (err, val) => {
                    if (!err && val) {
                        try {
                            const parsed = JSON.parse(val);
                            game = Object.assign(game, parsed);
                        } catch (e) { console.error(e); }
                    }
                });
            } else {
                const saved = localStorage.getItem('game_save');
                if (saved) {
                    try { game = JSON.parse(saved); } catch (e) {}
                }
            }
        }

        // Сохранение данных
        function saveGame() {
            const dataStr = JSON.stringify(game);
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('save_data', dataStr);
            } else {
                localStorage.setItem('game_save', dataStr);
            }
        }

        // Клик по монете
        document.getElementById('clickBtn').addEventListener('click', () => {
            game.money += game.perClick;
            updateUI();
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light'); // Вибрация в Telegram при клике
            }
        });

        // Покупка улучшений
        function buyUpgrade(id) {
            let up = game.upgrades[id];
            if (game.money >= up.cost) {
                game.money -= up.cost;
                up.count++;
                game.perSecond += up.cps;
                up.cost = Math.floor(up.cost * up.costMult);
                updateUI();
                saveGame();
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('money').innerText = Math.floor(game.money) + ' ₽';
            document.getElementById('income').innerText = 'Доход в сек: ' + game.perSecond + ' ₽';

            // Обновление апгрейда 1
            let u1 = game.upgrades[1];
            document.getElementById('u1-cost').innerText = `Цена: ${u1.cost} ₽ (+${u1.cps}/сек) [ур. ${u1.count}]`;
            document.getElementById('buy1').disabled = game.money < u1.cost;

            // Обновление апгрейда 2
            let u2 = game.upgrades[2];
            document.getElementById('u2-cost').innerText = `Цена: ${u2.cost} ₽ (+${u2.cps}/сек) [ур. ${u2.count}]`;
            document.getElementById('buy2').disabled = game.money < u2.cost;
        }

        // Игровой цикл (каждую секунду)
        setInterval(() => {
            if (game.perSecond > 0) {
                game.money += game.perSecond;
                updateUI();
            }
        }, 1000);

        // Автосохранение каждые 10 секунд
        setInterval(() => {
            saveGame();
        }, 10000);

        // Запуск при загрузке
        loadGame();
        setTimeout(updateUI, 500);
    </script>
</body>
</html>
