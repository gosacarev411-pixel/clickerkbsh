<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>От бомжа до миллионера</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <!-- Верхняя панель -->
    <div class="header">
        <h2 id="playerName">Бомж</h2>
        <span>Деньги: $<span id="money"></span></span>
        <span>Доход: $<span id="incomePerSec"></span>/сек</span>
        <button id="wheelBtn"><i class="fa-solid fa-gift"></i> Колесо Фортуны</button>
        <button id="shopBtn"><i class="fa-solid fa-store"></i> Магазин</button>
    </div>

    <!-- Основная зона -->
    <div class="main-area">
        <div class="character" id="character">
            🧟‍♂️
        </div>
        <div class="tap-zone">
            <button id="tapBtn" class="tap-button">КЛИКНУТЬ</button>
            <p>чтобы заработать на банку тушенки</p>
        </div>
    </div>

    <!-- Модальное окно магазина -->
    <div id="shopModal" class="modal hidden">
        <div class="modal-content">
            <h3><i class="fa-solid fa-store"></i> Подворотные апгрейды</h3>
            <div id="upgradesContainer"></div>
            <button id="closeShopBtn">Закрыть магазин</button>
        </div>
    </div>

    <!-- Модальное окно колеса фортуны -->
    <div id="wheelModal" class="modal hidden">
        <div class="modal-content wheel-modal">
            <h3><i class="fa-solid fa-gift"></i> Колесо Фортуны</h3>
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
            <button id="spinWheelBtn" disabled>Вращать!</button>
            <small>Вы можете крутить колесо только один раз каждые 24 часа.</small>
        </div>
    </code>
</div>
<script src="https://kit.fontawesome.com/695f7c9ebe.js" crossorigin="anonymous"></script>
<script src="code.js"></script>
</body>
</html>
