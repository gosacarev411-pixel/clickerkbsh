    <!-- Верхняя панель -->

        <h1 id="playerName">Бомж</h1>

    <!-- Меню навигации -->

        </div>
    </section>

    <section id="page-shop">
        <h2>Подворотные апгрейды</h2>
        <ul id="upgradesContainer"></ul>
    </section>

    <section id="page-wheel">
        <h2>Колесо Фортуны</h2>
        <div id="wheel-info">
            <p>Раз в 24 часа вы можете провернуть Колесо.</p>
