<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Анимированный фон матрицы -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Верхняя часть: Баланс -->
    <div class="header">
        <div class="score-container">
            <span id="score">0.0000</span> <span>💰</span>
        </div>
    </div>

    <!-- Центральная часть: Кнопка-монета -->
    <div class="game-container">
        <div class="coin" id="coin">🪙</div>
    </div>

    <!-- Нижняя часть: Энергия, таймер и кнопка -->
    <div class="footer">
        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ Энергия</span>
                <span id="energy-text">500 / 500</span>
            </div>
            <div class="energy-bar-background">
                <div class="energy-progress" id="energy-progress"></div>
            </div>
        </div>

        <button class="buy-boost-btn" id="buy-boost-btn">Купить бонус</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
