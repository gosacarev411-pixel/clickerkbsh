<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Kombat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Coin Kombat</h1>
        
        <div class="stats">
            <div>Монеты: <span id="coins">0</span></div>
            <div>Доход в секунду: <span id="per-second">0</span></div>
            <div>Уровень тапа: <span id="tap-level">1</span>x</div>
        </div>

        <div class="click-area" onclick="tapCoin()">
            <span id="tap-effect" class="tap-effect">+1</span>
            <img src="https://i.imgur.com/7XhZ0yR.png" alt="Tap the hamster" class="click-img">
        </div>

        <h2>Улучшить доход</h2>
        <div class="upgrades" id="upgrades">
            <!-- Биржи будут добавляться сюда скриптом -->
        </div>

        <div class="save-load">
            <button onclick="saveGame()">Сохранить</button>
            <button onclick="loadGame()">Загрузить</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
